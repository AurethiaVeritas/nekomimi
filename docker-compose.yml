# This is a sample docker-compose.yml file for nekomimi-asmr. Modify it according to your needs.

services:
  nekomimi:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: nekomimi-asmr:latest
    container_name: nekomimi
    # Match these values to the owner of bind-mounted host directories when
    # UID/GID 1000 is not appropriate for the Docker host.
    user: "${NEKOMIMI_UID:-1000}:${NEKOMIMI_GID:-1000}"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/data
      - COVER_DIR=/app/cover
      # - MAX_COVER_BYTES=10485760
      # - TEMP_COVER_TTL_HOURS=24
      # Optional outbound proxy for scrapers
      # - HTTP_PROXY_HOST=
      # - HTTP_PROXY_PORT=
      # - HTTP_RETRY_LIMIT=5
      # - HTTP_RETRY_DELAY_MS=2000
      # - DLSITE_TIMEOUT_MS=10000
      # - HVDB_TIMEOUT_MS=10000
    ports:
      - "3000:3000"
    volumes:
      # Persist DB and settings
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
      # Persist cover images generated by server
      - type: bind
        source: ./cover
        target: /app/cover
        bind:
          create_host_path: false
      # Optional: mount your media library inside the container
      # - /absolute/path/to/your/library:/library:ro
    restart: unless-stopped
