<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Glow background for icon -->
  <circle cx="200" cy="120" r="70" fill="url(#glow)" filter="url(#blur)"/>
  
  <!-- Main icon circle -->
  <circle cx="200" cy="120" r="50" fill="#1e293b" stroke="#334155" stroke-width="2.5"/>
  
  <!-- Question mark (scaled to fit within circle) -->
  <g fill="#22d3ee" transform="translate(200, 120)">
    <path d="M 0 -28 
             Q -8 -28 -12 -24
             Q -16 -20 -16 -12
             L -8 -12
             Q -8 -16 -6 -18
             Q -4 -20 0 -20
             Q 4 -20 6 -18
             Q 8 -16 8 -12
             Q 8 -9 6 -6
             Q 4 -3 0 1
             Q -4 5 -6 8
             Q -8 11 -8 16
             L -8 18
             L 0 18
             L 0 16
             Q 0 13 1 11
             Q 2 9 6 5
             Q 10 1 12 -3
             Q 14 -7 14 -12
             Q 14 -20 9 -24
             Q 4 -28 0 -28 Z"/>
    <circle cx="-4" cy="26" r="3.5"/>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.3" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round">
    <path d="M 80 220 Q 120 200 160 220"/>
    <path d="M 240 220 Q 280 200 320 220"/>
    <circle cx="100" cy="240" r="4" fill="#22d3ee"/>
    <circle cx="300" cy="240" r="4" fill="#22d3ee"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="265" text-anchor="middle" fill="#cbd5e1" font-size="16" font-family="system-ui, -apple-system, Segoe UI, Roboto" opacity="0.7">
    No Cover Available
  </text>
</svg>

