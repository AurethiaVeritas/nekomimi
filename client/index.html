<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nekomimi</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nekomimi" />
  <script>
    // Apply theme early to avoid flash on load and set PWA class
    (function () {
      try {
        var pref = localStorage.getItem('themePref');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var root = document.documentElement;
        var setLight = function (on) { if (on) root.classList.add('light'); else root.classList.remove('light'); };
        if (!pref || pref === 'system') setLight(!dark); else setLight(pref === 'light');
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches;
        if (isStandalone) { root.classList.add('pwa'); }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
